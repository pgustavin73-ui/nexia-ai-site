<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha — NEXIA AI</title><link rel="stylesheet" href="auth.css"></head><body><main class="resetPage"><div class="resetCard"><h1>Redefinir senha</h1><form id="resetForm"><label for="newPassword">Nova senha</label><input id="newPassword" type="password" minlength="6" autocomplete="new-password" required><button class="primary full">Salvar nova senha</button><p id="result" role="status"></p></form><a href="index.html">Voltar ao site</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const result = document.querySelector('#result');
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
document.querySelector('#resetForm').addEventListener('submit', async e => { e.preventDefault(); const { error } = await client.auth.updateUser({ password: document.querySelector('#newPassword').value }); result.textContent = error ? error.message : 'Senha alterada! Volte ao site e entre.'; });
</script></body></html>
