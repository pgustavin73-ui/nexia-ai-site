
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>Teste Asaas | NEXIA AI</title>

<style>
* { box-sizing: border-box; }

body {
  background: #090e1b;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
}

main {
  max-width: 450px;
  margin: 50px auto;
  background: #151e32;
  padding: 25px;
  border-radius: 18px;
  border: 1px solid #7c3aed;
}

h1 { color: #c4a5ff; }

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  color: white;
  background: #7c3aed;
  font-weight: bold;
  cursor: pointer;
}

#resultado {
  margin-top: 20px;
  padding: 15px;
  background: #0f172a;
  border-radius: 12px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<main>
<h1>💜 NEXIA AI</h1>
<h2>💳 Teste de conexão Asaas</h2>

<p>🧪 Ambiente Sandbox</p>
<p>Nenhuma cobrança será criada.</p>

<button id="login">
  🔐 Entrar com Google
</button>

<h3>💳 Assinaturas mensais</h3>

<button type="button" class="criarCheckout" data-plano="essencial">
  Essencial — R$ 29,90
</button>

<button type="button" class="criarCheckout" data-plano="profissional">
  Profissional — R$ 59,90
</button>

<button type="button" class="criarCheckout" data-plano="enterprise">
  Enterprise — R$ 99,90
</button>
  
<button id="testar">
  🔌 Testar conexão Asaas
</button>

<div id="resultado" role="status">
  Aguardando teste...
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./config.js"></script>

<script>
const resultado =
  document.getElementById("resultado");

const cliente =
  window.supabase &&
  window.SUPABASE_URL &&
  window.SUPABASE_PUBLISHABLE_KEY
  ? window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    )
  : null;

document.getElementById("login")
  .addEventListener("click", async () => {
    if (!cliente) {
      resultado.textContent =
        "Supabase não configurado.";
      return;
    }

    const { error } =
      await cliente.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: location.origin +
            "/teste-asaas.html"
        }
      });

    if (error) {
      resultado.textContent = error.message;
    }
  });

document.getElementById("testar")
  .addEventListener("click", async () => {
    resultado.textContent =
      "Verificando conexão...";

    try {
      if (!cliente) {
        throw new Error(
          "Supabase não configurado."
        );
      }

      const { data, error } =
        await cliente.auth.getSession();

      if (error) throw error;

      if (!data.session) {
        resultado.textContent =
          "Faça login com Google primeiro.";
        return;
      }

      const resposta = await fetch(
        "/api/asaas-seguro",
        {
          method: "GET",
          cache: "no-store",
          headers: {
            Authorization:
              "Bearer " +
              data.session.access_token
          }
        }
      );

      const dados = await resposta.json();

      resultado.textContent =
        dados.mensagem ||
        "Resposta não reconhecida.";

    } catch (erro) {
      resultado.textContent =
        "Erro: " + erro.message;
    }
  });
  
document.querySelectorAll(".criarCheckout")
  .forEach(botao => {
    botao.addEventListener("click", async () => {
      const plano = botao.dataset.plano;
      botao.disabled = true;

      resultado.textContent =
        "Criando link de teste...";

      try {
        if (!cliente) {
          throw new Error("Login não configurado");
        }

        const { data, error } =
          await cliente.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          throw new Error(
            "Entre com Google primeiro"
          );
        }

        const resposta = await fetch(
          "/api/checkout-teste",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization:
                "Bearer " +
                data.session.access_token
            },
            body: JSON.stringify({ plano })
          }
        );

        const dados = await resposta.json();

        if (!resposta.ok || !dados.ok) {
          throw new Error(
            dados.mensagem || "Falha no teste"
          );
        }

        resultado.textContent =
          "✅ " + dados.mensagem;

        if (dados.link) {
          const url = new URL(dados.link);

          if (
            url.protocol !== "https:" ||
            !(
              url.hostname === "asaas.com" ||
              url.hostname.endsWith(".asaas.com")
            )
          ) {
            throw new Error("Link inesperado");
          }

          const link = document.createElement("a");
          link.href = url.href;
          link.textContent =
            "Abrir checkout de teste";
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          resultado.appendChild(
            document.createElement("br")
          );
          resultado.appendChild(link);
        }

      } catch (erro) {
        resultado.textContent =
          "❌ " + erro.message;
      } finally {
        botao.disabled = false;
      }
    });
  });

</script>
</body>
</html>
