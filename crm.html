<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXIA AI | CRM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090e1b;color:white;font-family:Arial,sans-serif}
header{background:#151e32;padding:22px}
h1{color:#a58bff;margin:0}
main{max-width:950px;margin:auto;padding:20px}
section{background:#151e32;border:1px solid #303c58;border-radius:14px;padding:20px;margin-bottom:18px}
input,select,button{padding:12px;border-radius:8px;font-size:15px}
input,select{background:#0b1324;color:white;border:1px solid #405071;width:100%;margin:6px 0 12px}
button{background:#9576f7;border:0;color:#0c0920;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
a{color:#c3b3ff}
#mensagem{color:#ffd38b}
table{width:100%;border-collapse:collapse;min-width:550px}
td,th{padding:12px;border-bottom:1px solid #303c58;text-align:left}
.tabela{overflow-x:auto}
.excluir{background:#48283a;color:white}
</style>
</head>
<body>
<header>
<h1>✦ NEXIA AI</h1>
<p>CRM conectado ao Supabase</p>
<a href="painel.html">Voltar ao painel</a>
</header>

<main>
<section>
<h2>Minha conta</h2>
<p id="usuario">Verificando login...</p>
<p id="mensagem" role="status"></p>
</section>

<section>
<h2>Cadastrar negociação</h2>
<form id="form">
<label>Nome da empresa</label>
<input id="nome" required maxlength="80" placeholder="Empresa Exemplo">

<label>Contato</label>
<input id="contato" maxlength="80" placeholder="Contato de teste">

<label>Valor (R$)</label>
<input id="valor" type="number" min="0" step="0.01" value="0" required>

<label>Etapa</label>
<select id="etapa">
<option>Novo lead</option>
<option>Em contato</option>
<option>Proposta</option>
<option>Negociação</option>
<option>Ganho</option>
<option>Perdido</option>
</select>

<button id="salvar" type="submit" disabled>Salvar no Supabase</button>
</form>
</section>

<section>
  <h2>Funil de Vendas</h2>
  <div id="funil" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">
  </div>
</section>
  

  <section>
<h2>Minhas negociações</h2>
<p>Total: <strong id="total">0</strong></p>
<div class="tabela">
<table>
<thead>
<tr>
<th>Empresa</th>
<th>Contato</th>
<th>Valor</th>
<th>Etapa</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./config.js"></script>
<script>
'use strict';

const $ = id => document.getElementById(id);
let cliente;
let usuario;

function mensagem(texto) {
  $('mensagem').textContent = texto;
}

function moeda(valor) {
  return Number(valor || 0).toLocaleString('pt-BR', {
    style: 'currency',
    currency: 'BRL'
  });
}

async function iniciar() {
  if (!window.supabase ||
      !window.SUPABASE_URL ||
      !window.SUPABASE_PUBLISHABLE_KEY) {
    mensagem('Configuração do Supabase não encontrada.');
    return;
  }

  cliente = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_PUBLISHABLE_KEY
  );

  const {data, error} = await cliente.auth.getUser();

  if (error || !data.user) {
    $('usuario').textContent = 'Você precisa entrar na sua conta.';
    const link = document.createElement('a');
    link.href = 'cadastro.html';
    link.textContent = 'Fazer login';
    $('usuario').append(' ', link);
    return;
  }

  usuario = data.user;
  $('usuario').textContent = usuario.email;
  $('salvar').disabled = false;
  mensagem('Conectado ao Supabase!');
  await carregar();
}


function atualizarFunil(negociacoes) {
  const etapas = [
    'Novo lead',
    'Em contato',
    'Proposta',
    'Negociação',
    'Ganho',
    'Perdido'
  ];

  const funil = document.getElementById('funil');
  if (!funil) return;

  funil.replaceChildren();

  for (const etapa of etapas) {
    const quantidade = negociacoes.filter(
      item => item.etapa === etapa
    ).length;

    const card = document.createElement('div');
    card.style.cssText =
      'background:#0b1324;padding:15px;border-radius:10px;text-align:center';

    const titulo = document.createElement('strong');
    titulo.textContent = etapa;

    const numero = document.createElement('h2');
    numero.textContent = quantidade;
    numero.style.color = '#a58bff';

    card.append(titulo, numero);
    funil.appendChild(card);
  }
}
  
  async function carregar() {
  const {data, error} = await cliente
    .from('negociacoes')
    .select('id,nome,contato,valor,etapa')
    .eq('user_id', usuario.id)
    .order('id', {ascending:false});

  if (error) {
    mensagem('Erro ao carregar: ' + error.message);
    return;
  }

  const lista = $('lista');
  lista.replaceChildren();
  $('total').textContent = data.length;
    atualizarFunil(data);

  for (const item of data) {
    const tr = document.createElement('tr');

    for (const valor of [
      item.nome,
      item.contato || '-',
      moeda(item.valor),
      item.etapa
    ]) {
      const td = document.createElement('td');
      td.textContent = valor;
      tr.appendChild(td);
    }

   

const mudarEtapa = document.createElement('button');
mudarEtapa.textContent = 'Alterar etapa';
mudarEtapa.style.marginRight = '8px';

mudarEtapa.onclick = async () => {
  const etapas = [
    'Novo lead',
    'Em contato',
    'Proposta',
    'Negociação',
    'Ganho',
    'Perdido'
  ];

  const escolha = prompt(
    etapas.map((etapa, i) => `${i + 1} - ${etapa}`).join('\n') +
    '\n\nDigite o número da nova etapa:'
  );

  if (escolha === null) return;

  const numero = Number(escolha);
  if (!Number.isInteger(numero) || numero < 1 || numero > 6) {
    alert('Escolha um número de 1 a 6.');
    return;
  }

  mudarEtapa.disabled = true;

  const { error } = await cliente
    .from('negociacoes')
    .update({ etapa: etapas[numero - 1] })
    .eq('id', item.id)
    .eq('user_id', usuario.id);

  if (error) {
    mensagem('Erro ao alterar etapa: ' + error.message);
    mudarEtapa.disabled = false;
  } else {
    mensagem('Etapa atualizada!');
    await carregar();
  }
};
    
    const editar = document.createElement('button');
editar.textContent = 'Editar';
editar.style.marginRight = '8px';

editar.onclick = async () => {
  const nome = prompt('Nome da empresa:', item.nome);
  if (nome === null) return;
  if (!nome.trim()) {
    alert('O nome não pode ficar vazio.');
    return;
  }

  const contato = prompt('Contato:', item.contato || '');
  if (contato === null) return;

  const valor = prompt('Valor em R$:', item.valor);
  if (valor === null) return;
  if (valor.trim() === '' || !Number.isFinite(Number(valor)) || Number(valor) < 0) {
    alert('Digite um valor válido.');
    return;
  }

  editar.disabled = true;

  const { error } = await cliente
    .from('negociacoes')
    .update({
      nome: nome.trim(),
      contato: contato.trim(),
      valor: Number(valor)
    })
    .eq('id', item.id)
    .eq('user_id', usuario.id);

  if (error) {
    mensagem('Erro ao editar: ' + error.message);
  } else {
    mensagem('Negociação atualizada!');
  }

  await carregar();
};
    
    const td = document.createElement('td');
    const botao = document.createElement('button');
    botao.textContent = 'Excluir';
    botao.className = 'excluir';

    botao.onclick = async () => {
      if (!confirm('Excluir esta negociação?')) return;

      botao.disabled = true;

      const {error} = await cliente
        .from('negociacoes')
        .delete()
        .eq('id', item.id)
        .eq('user_id', usuario.id);

      if (error) {
        mensagem('Erro ao excluir: ' + error.message);
      } else {
        mensagem('Negociação excluída.');
      }

      await carregar();
    };

    td.appendChild(mudarEtapa);
    td.appendChild(editar);
    td.appendChild(botao);
    tr.appendChild(td);
    lista.appendChild(tr);
  }
}

$('form').onsubmit = async evento => {
  evento.preventDefault();
  if (!usuario) return;

  $('salvar').disabled = true;
  mensagem('Salvando...');

  const dados = {
    user_id: usuario.id,
    nome: $('nome').value.trim(),
    contato: $('contato').value.trim(),
    valor: Number($('valor').value),
    etapa: $('etapa').value
  };

  const {error} = await cliente
    .from('negociacoes')
    .insert(dados);

  if (error) {
    mensagem('Erro ao salvar: ' + error.message);
  } else {
    mensagem('Negociação salva no Supabase!');
    $('form').reset();
    await carregar();
  }

  $('salvar').disabled = false;
};

iniciar().catch(erro => {
  mensagem('Erro de conexão: ' + erro.message);
});
</script>
</body>
</html>
